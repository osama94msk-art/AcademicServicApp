name: بناء التطبيق تلقائياً 🚀

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: تحميل الكود
      uses: actions/checkout@v3
    
    - name: إعداد Java
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: gradle
    
    - name: إصلاح Gradle Wrapper (إذا كان تالفاً)
      run: |
        if [ -f gradle/wrapper/gradle-wrapper.jar ]; then
          if ! jar tf gradle/wrapper/gradle-wrapper.jar >/dev/null 2>&1; then
            echo "Gradle wrapper تالف - إعادة توليد..."
            rm -rf gradle/wrapper/gradle-wrapper.jar
            gradle wrapper --gradle-version 8.0
          fi
        else
          echo "Gradle wrapper مفقود - إنشاء جديد..."
          gradle wrapper --gradle-version 8.0
        fi
    
    - name: إعطاء صلاحيات Gradle
      run: chmod +x gradlew
    
    - name: بناء المشروع
      run: ./gradlew build
    
    - name: بناء APK Debug
      run: ./gradlew assembleDebug
    
    - name: البحث عن ملفات APK
      run: find . -name "*.apk" -type f
    
    - name: رفع APK كـ Artifact
      uses: actions/upload-artifact@v3
      with:
        name: app-apk
        path: app/build/outputs/apk/
        retention-days: 30
    
    - name: إنشاء Release ورفع APK
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: تحميل الكود
      uses: actions/checkout@v3
    
    - name: إعداد Java
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: gradle
    
    - name: إعطاء صلاحيات Gradle
      run: chmod +x gradlew
    
    - name: تشغيل الاختبارات
      run: ./gradlew test
      continue-on-error: true
    
    - name: تحليل الكود
      run: ./gradlew lint
      continue-on-error: true
