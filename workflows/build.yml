name: بناء التطبيق تلقائياً 🚀

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: تحميل الكود
      uses: actions/checkout@v3
    
    - name: إعداد Java
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: gradle
    
    - name: إعطاء صلاحيات Gradle
      run: chmod +x gradlew
    
    - name: بناء المشروع
      run: ./gradlew build
    
    - name: بناء APK Debug
      run: ./gradlew assembleDebug
    
    - name: بناء APK Release (بدون توقيع)
      run: ./gradlew assembleRelease -Pandroid.injected.signing.store.file=/dev/null
      continue-on-error: true
    
    - name: البحث عن ملفات APK
      run: find . -name "*.apk" -type f
    
    - name: رفع APK كـ Artifact
      uses: actions/upload-artifact@v3
      with:
        name: app-apk
        path: app/build/outputs/apk/
        retention-days: 30
    
    - name: إنشاء Release ورفع APK
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: تحميل الكود
      uses: actions/checkout@v3
    
    - name: إعداد Java
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: gradle
    
    - name: إعطاء صلاحيات Gradle
      run: chmod +x gradlew
    
    - name: تشغيل الاختبارات
      run: ./gradlew test
      continue-on-error: true
    
    - name: تحليل الكود
      run: ./gradlew lint
      continue-on-error: true
